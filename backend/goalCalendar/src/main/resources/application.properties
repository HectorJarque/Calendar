# Base de datos (valores reales van en variables de entorno de Render)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS: en local usa localhost:4200, en producción la URL de Vercel
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:4200}

# Puerto
server.port=8080

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.web.cors.enabled=true

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

management.endpoints.web.exposure.exclude=*
management.endpoint.health.show-details=never

show-sql=false